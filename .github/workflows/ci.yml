name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders only — never real secrets. `next build` and
      # `prisma generate` need these present so module-scope reads of
      # process.env don't throw; nothing in this workflow connects to a
      # real database or sends real mail. Do not replace with real values.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_placeholder"
      NEXTAUTH_SECRET: "ci-placeholder-secret-not-for-production-use"
      NEXTAUTH_URL: "http://localhost:3000"
      # `next build` runs with NODE_ENV=production internally, which trips
      # src/lib/rate-limit.ts's fail-fast startup guard if these are unset —
      # that guard exists specifically so a real production deploy can't
      # silently run without rate limiting; CI needs placeholders to build
      # at all, same reasoning as the vars above.
      UPSTASH_REDIS_REST_URL: "https://ci-placeholder.upstash.io"
      UPSTASH_REDIS_REST_TOKEN: "ci-placeholder-token-not-for-production-use"
      # Only needed once the security-headers smoke test below actually
      # starts the server — src/instrumentation.ts's register() runs
      # validateEnv() at server startup (not at build time), and it hard-
      # requires this to be set. Never a real key; nothing in this workflow
      # calls src/lib/encryption.ts.
      LOCAL_ENCRYPTION_KEY: "ci-placeholder-encryption-key-not-for-production-use"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Reports lint findings without blocking the pipeline — the app has
      # a large pre-existing lint backlog (see docs/audit-history.md /
      # AGENTS.md's `any` policy) that's a separate cleanup effort, not
      # something a first CI pass should gate on.
      - name: Lint (report only, non-blocking)
        run: npm run lint
        continue-on-error: true

      # Report-only, matching the lint step above: there is currently one
      # known, deliberately-deferred high finding (nodemailer, needs a 7->9
      # major bump across all 12 email call sites - see the commit that
      # bumped js-yaml/nanoid/postcss the same day this step was added).
      # Blocking on it would just train everyone to ignore a permanently
      # red check. Still runs on every push so a genuinely NEW high/critical
      # shows up immediately in the log instead of waiting for the next
      # manual `npm audit` pass.
      - name: Dependency audit (report only, non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

      # Guards against the exact class of bug found manually this session:
      # proxy.ts existed, looked correct on read-through, and was silently
      # never invoked because it lived one directory level above where this
      # Next.js version actually looks for it (must sit next to src/app, not
      # at the repo root). Code review didn't catch that - only curling a
      # real `next start` response did. This re-proves the same six headers
      # on every push so a future regression fails CI immediately instead of
      # waiting for another manual audit to notice.
      - name: Security headers smoke test
        run: |
          npm start -- -p 3100 &
          SERVER_PID=$!

          READY=0
          for i in $(seq 1 30); do
            if curl -s -o /dev/null "http://localhost:3100/login"; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::Server never became ready on :3100"
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi

          HEADERS=$(curl -s -D - -o /dev/null "http://localhost:3100/login")
          echo "$HEADERS"
          kill "$SERVER_PID" 2>/dev/null || true

          fail=0
          check() {
            if ! echo "$HEADERS" | grep -qiE "$1"; then
              echo "::error::Missing or incorrect header, expected to match: $1"
              fail=1
            fi
          }
          check "^content-security-policy:.*nonce-"
          check "^x-frame-options: *DENY"
          check "^x-content-type-options: *nosniff"
          check "^referrer-policy: *strict-origin-when-cross-origin"
          check "^permissions-policy:"
          check "^strict-transport-security:.*max-age="

          if echo "$HEADERS" | grep -qi "^x-powered-by:"; then
            echo "::error::X-Powered-By is present - poweredByHeader: false in next.config.ts isn't taking effect"
            fail=1
          fi

          exit $fail
